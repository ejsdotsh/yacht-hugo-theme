baseURL: "https://ejsdotsh.github.io/yacht-hugo-theme/"
locale: en-us
title: "YACHT"
subtitle: "YACHT Another Custom Hugo Theme"

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css

hugoVersion:
   min: "0.166.0"
   extended: true

module:
  mounts:
  - source: assets
    target: assets
  - disableWatch: true
    source: hugo_stats.json
    target: assets/notwatching/hugo_stats.json
  imports:
    - path: github.com/ejsdotsh/yacht-hugo-theme
      disable: false

security:
  exec:
    allow:
    - ^(dart-)?sass$
    - ^go$
    - ^git$
    - ^node$
    - ^postcss$
    - ^tailwindcss$

markup:
  goldmark:
    renderer:
      unsafe: true
  duplicateResourceFiles: true
 
params:
  author: "e.j. sahala (they/them)"
  description: "YACHT Another Custom Hugo Theme - a punny and recursively named theme for the Hugo static site generator."
  copyrightFrom: "2022"
  # logoPicture: "yacht-logo.svg"
  profilePicture: "yacht-mocha.svg"
  profilePictureAlt: "YACHT Another Custom Hugo Theme"

  # github integration
  gh_url: "https://api.github.com/search/repositories"
  gh_user: "ejsdotsh"

menus:
  main:
    - identifier: "home"
      name: "home"
      weight: 100
      url: "/"
    - identifier: "about"
      name: "about"
      weight: 110
      url: "/about/"
    - identifier: "blog"
      name: "blog"
      weight: 130
      url: "/blog/"
    - identifier: "projects"
      name: "projects"
      weight: 140
      url: "/projects/"
    # - identifier: "contact"
    #   name: "contact"
    #   weight: 1000
    #   url: "/contact/"
