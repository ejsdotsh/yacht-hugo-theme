<!-- _default/list.html -->
{{ define "main" }}
<div class="rounded-lg stack yacht-default__list">
  <div class="yacht-default__list-title">
    <h2>{{ .Title }}</h2>
  </div>
  <div class="yacht-default__list-content">
    {{ .Content }}
    <ul role="list" class="stack">
      {{ range .Pages }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
    </ul>
  </div>
</div>
{{ end }}
