<div class="repel py-6">
  <a class="yacht-header__logo font-et-book text-2xl font-normal hover:text-ctp-lavender transition-colors"
     href="{{ site.BaseURL }}" aria-label="{{ site.Title }}">
    {{ site.Title }}
  </a>

  <nav role="navigation" aria-label="main navigation">
    <ul role="list" id="menu" class="cluster">
      {{ range site.Menus.main.ByWeight }}
      <li>
        <a href="{{ .URL | relURL }}" title="{{ .Name }}"
           class="sans text-sm uppercase tracking-wide text-ctp-subtext
                  hover:text-ctp-lavender transition-colors">{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
  </nav>
</div>
